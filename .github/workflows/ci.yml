name: Build Flutter targets

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9' # Compatible with the project's Gradle wrapper.
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}
          pub-cache-key: pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}
      - name: Cache pub + Gradle directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-caches-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/**/gradle-wrapper.properties', 'android/**/*.gradle', 'android/**/*.gradle.kts') }}
          restore-keys: |
            android-caches-${{ runner.os }}-
      - name: Install dependencies
        run: flutter pub get
      - name: Run widget tests
        run: flutter test --no-pub
      - name: Build APK (debug)
        run: flutter build apk --debug
      - name: Upload Android artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS (xcode-27)
    runs-on: xcode-27
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - name: Select iOS SDK
        run: bash scripts/select-ios-sdk.sh
      - name: Install Flutter (stable)
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS (no codesign)
        run: |
          flutter build ios --debug --no-codesign
          sdk=$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' build/ios/iphoneos/Runner.app/Info.plist)
          test "$sdk" = "iphoneos$IOS_SDK_VERSION"
      - name: Upload iOS artifact (single extraction)
        uses: actions/upload-artifact@v5
        with:
          name: ios-runner-no-codesign
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
      - name: Build iOS Simulator app
        run: flutter build ios --simulator --debug --no-pub
      - name: Verify and archive iOS Simulator app
        run: |
          app=build/ios/iphonesimulator/Runner.app
          test -x "$app/Runner"
          platform=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")
          test "$platform" = iPhoneSimulator
          sdk=$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$app/Info.plist")
          test "$sdk" = "iphonesimulator$IOS_SDK_VERSION"
          codesign --verify --strict "$app"
          xcrun lipo -archs "$app/Runner"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/astralkeytest-ios-simulator.zip"
      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v5
        with:
          name: ios-simulator
          path: ${{ runner.temp }}/astralkeytest-ios-simulator.zip
          if-no-files-found: error
          compression-level: 0
      - name: Test Keychain and display regions on iPhone Duo
        timeout-minutes: 12
        run: |
          set -euo pipefail
          simulator=$(bash scripts/select-duo-simulator.sh)
          result="$RUNNER_TEMP/keychain-test.xcresult"
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$simulator" -parallel-testing-enabled NO \
            -only-testing:RunnerTests/RunnerTests/testKeychainCanStoreAndReadToken \
            -only-testing:RunnerTests/RunnerTests/testDuoRegionObserverIsAttachedToFlutterView \
            -resultBundlePath "$result" -quiet
          xcrun xcresulttool get test-results summary --path "$result" | jq -e '.passedTests == 2 and .failedTests == 0'

  windows:
    name: Windows x64 (windows-latest)
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}
          pub-cache-key: pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Upload Windows artifact (single extraction)
        uses: actions/upload-artifact@v5
        with:
          name: windows-x64-release
          path: build/windows/x64/runner/Release
          if-no-files-found: error
