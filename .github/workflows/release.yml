name: Build and publish release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths: ['.github/releases/*.md']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (example: v0.0.1)'
        required: true
      title:
        description: 'Release title'
        required: false
      notes:
        description: 'Release notes'
        required: false

permissions:
  contents: read

jobs:
  android:
    name: Build Android artifact
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9' # Compatible with the project's Gradle wrapper.
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}
          pub-cache-key: pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - run: flutter test --no-pub
      - run: flutter build apk --release --no-pub
      - uses: actions/upload-artifact@v5
        with:
          name: release-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: Build iOS device and simulator apps
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}
          pub-cache-key: pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - name: Build and archive iOS apps
        run: |
          flutter build ios --release --no-codesign --no-pub
          device=build/ios/iphoneos/Runner.app
          test -x "$device/Runner"
          ditto -c -k --keepParent "$device" "$RUNNER_TEMP/Runner-ios-release-no-codesign.zip"

          flutter build ios --simulator --debug --no-codesign --no-pub
          simulator=build/ios/iphonesimulator/Runner.app
          test -x "$simulator/Runner"
          platform=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$simulator/Info.plist")
          test "$platform" = iPhoneSimulator
          xcrun lipo -archs "$simulator/Runner"
          ditto -c -k --keepParent "$simulator" "$RUNNER_TEMP/astralkeytest-ios-simulator.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: release-ios-apps
          path: |
            ${{ runner.temp }}/Runner-ios-release-no-codesign.zip
            ${{ runner.temp }}/astralkeytest-ios-simulator.zip
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Build Windows artifact
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}
          pub-cache-key: pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - run: flutter build windows --release --no-pub
      - uses: actions/upload-artifact@v5
        with:
          name: release-windows-x64-dir
          path: build/windows/x64/runner/Release
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    needs: [android, ios, windows]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets stage/windows-x64-release
          cp dist/release-android-apk/app-release.apk release-assets/
          cp dist/release-ios-apps/Runner-ios-release-no-codesign.zip release-assets/
          cp dist/release-ios-apps/astralkeytest-ios-simulator.zip release-assets/
          cp -a dist/release-windows-x64-dir/. stage/windows-x64-release/
          test -s stage/windows-x64-release/astralkeytest.exe
          (cd stage && zip -r "$GITHUB_WORKSPACE/release-assets/windows-x64-release.zip" windows-x64-release)
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          TAG: ${{ github.event.inputs.tag }}
          TITLE: ${{ github.event.inputs.title }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version=$(sed -n 's/^version: \([^+[:space:]]*\).*/\1/p' pubspec.yaml)
            test -n "$version"
            tag="v$version"
            notes=".github/releases/$tag.md"
            test -s "$notes"
            if [[ $(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- "$notes") != "$notes" ]]; then
              echo "Update $notes to request a release of $tag."
              exit 1
            fi
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "Tag $tag already exists."
              exit 1
            fi
            gh release create "$tag" release-assets/* --target "$GITHUB_SHA" \
              --title "Astral Key Test $tag" --notes-file "$notes"
            exit
          fi

          title="${TITLE:-$TAG}"
          notes="${NOTES:-Automated release build from workflow_dispatch.}"

          if gh release view "$TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber -R "$GH_REPO"
            gh release edit "$TAG" --title "$title" --notes "$notes" -R "$GH_REPO"
          else
            gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "$title" --notes "$notes" -R "$GH_REPO"
          fi
